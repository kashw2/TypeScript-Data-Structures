name: Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - src/**
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: install dependencies
        run: npm ci --force
      - name: build
        run: npm run build

