name: Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - src/**
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: install dependencies
        run: npm ci --force
      - name: test
        run: npm test

