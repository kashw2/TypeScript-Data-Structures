name: Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - src/**
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: install dependencies
        run: npm ci --force
      - name: test
        run: npm test

